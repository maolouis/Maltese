[package]
name = "maltese-assistant"
version = "0.1.0"
description = "A line-dog desktop assistant for Windows."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maltese_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 发布构建时嵌入前端资源（tauri build 会自动带上）。
# 直接跑 cargo build --release 时若没有这个 feature，app 会去连 devUrl
# localhost:1420，表现为“网页无法加载”。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
imap = "2.4"
imap-proto = "0.10"
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
mailparse = "0.17"
native-tls = "0.2"
pollster = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
windows = { version = "0.61", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media", "Media_Control", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "UI_Notifications_Management", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-future = { version = "0.2", features = ["std"] }

[dev-dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "UI_Notifications_Management", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility"] }
